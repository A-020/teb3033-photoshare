# PhotoShare Nginx site (guide section 4.3)
# Install on the EC2 server with:
#   sudo cp ~/app/deploy/nginx.conf /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Uploads are limited to 5 MB by the API. Nginx's default is 1 MB,
    # which would reject most photos before they reach Express.
    client_max_body_size 10M;

    # The React build (frontend/dist), copied here on each deploy
    root /var/www/photoshare;
    index index.html;

    # React Router support: unknown paths such as /groups or /photos/12
    # return index.html, and the client-side router shows the right page.
    location / {
        try_files $uri /index.html;
    }

    # API calls go to the Node server managed by PM2.
    # No trailing slash on proxy_pass, so the /api prefix is kept.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
